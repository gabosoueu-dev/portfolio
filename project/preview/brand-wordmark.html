<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 40px 48px; min-height: 220px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; }
  .mark { display: flex; align-items: baseline; gap: 2px; }
  .mark .t { font-size: 110px; font-weight: 500; letter-spacing: -0.06em; line-height: 0.85; color: var(--ink); }
  .mark .d { font-size: 110px; font-weight: 500; line-height: 0.85; color: var(--blue); }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); max-width: 200px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="mark"><span class="t">gabo</span><span class="d">.</span></div>
  <div class="meta">Wordmark · Geist Medium · −0.06em tracking · blue full stop only</div>
</body>
</html>
