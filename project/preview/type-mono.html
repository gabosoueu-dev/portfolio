<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Mono &amp; meta</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 30px 40px; min-height: 260px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 18px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .row:first-of-type { border-top: 0; }
  .row .what { width: 130px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  .meta { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 17px; color: var(--ink); }
</style>
</head>
<body>
  <div class="row"><span class="what">UPPER LABEL · 11</span><span class="label">01 / SELECTED WORK</span></div>
  <div class="row"><span class="what">META · 13</span><span class="meta">Product lead · 2024 — present · Mexico City</span></div>
  <div class="row"><span class="what">TABULAR NUM · 17</span><span class="num">+18% &nbsp;·&nbsp; 6 mo &nbsp;·&nbsp; 12 ppl</span></div>
</body>
</html>
