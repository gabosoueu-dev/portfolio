<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gabo — Rebuilding onboarding for a payments app</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  /* =========================================================
     Case study — page styles
     ========================================================= */

  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); }
  * { box-sizing: border-box; }

  /* ---------- shared ---------- */
  .mono-label {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-2);
  }
  .dot-sep { color: var(--ink-3); margin: 0 8px; }

  /* ---------- nav ---------- */
  .site-nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 64px;
    background: rgba(241, 236, 224, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .brand {
    font-family: var(--font-sans); font-weight: 500; font-size: 20px;
    letter-spacing: -0.015em; color: var(--ink); text-decoration: none;
  }
  .brand-dot { color: var(--blue); }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-2); text-decoration: none;
  }
  .back-link:hover { color: var(--blue); }
  @media (max-width: 720px) { .site-nav { padding: 14px 24px; } }

  /* ---------- case hero (full-bleed colour block) ---------- */
  .case-hero { position: relative; width: 100%; overflow: hidden; }
  .case-hero-inner {
    max-width: 1280px; margin: 0 auto; padding: 80px 64px 96px 64px;
    display: flex; flex-direction: column; gap: 80px; min-height: 78vh;
    position: relative; z-index: 2;
  }
  .case-hero-top { display: flex; align-items: center; justify-content: space-between; }
  .case-hero-num, .case-hero-year, .case-hero-role { color: rgba(241,236,224,0.65); }
  .case-hero-yellow .case-hero-num,
  .case-hero-yellow .case-hero-year,
  .case-hero-yellow .case-hero-role { color: rgba(17,19,24,0.55); }
  .case-hero-client {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(241,236,224,0.75); margin-bottom: 18px;
  }
  .case-hero-title {
    font-size: 128px; font-weight: 500; letter-spacing: -0.035em; line-height: 0.95;
    margin: 0 0 32px 0; max-width: 1000px;
    animation: fadeUp 0.7s var(--ease-std) both;
  }
  .case-hero-blue   { background: var(--blue);   color: var(--paper); }
  .case-hero-yellow { background: var(--yellow); color: var(--ink); }
  .case-hero-ink    { background: var(--ink);    color: var(--paper); }
  .case-hero-shape {
    position: absolute; right: -80px; bottom: -80px; width: 360px; height: 360px;
    background: rgba(244,199,54,0.95); z-index: 1;
    transform: rotate(0deg);
  }
  .case-hero-yellow .case-hero-shape { background: var(--blue); }
  .case-hero-ink .case-hero-shape    { background: var(--blue); }
  @media (max-width: 900px) {
    .case-hero-inner { padding: 56px 24px 64px 24px; min-height: 60vh; gap: 56px; }
    .case-hero-title { font-size: 64px; }
    .case-hero-shape { width: 200px; height: 200px; right: -40px; bottom: -40px; }
  }

  /* ---------- meta block ---------- */
  .case-meta { max-width: 1280px; margin: 0 auto; padding: 64px 64px 32px 64px; }
  .case-meta-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;
    border-top: 1px solid var(--ink); padding-top: 24px;
  }
  .case-meta-item { display: flex; flex-direction: column; gap: 8px; }
  .case-meta-value { font-size: 17px; color: var(--ink); }
  @media (max-width: 720px) {
    .case-meta { padding: 40px 24px 24px 24px; }
    .case-meta-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
  }

  /* ---------- long-form sections ---------- */
  .case-section {
    max-width: 1280px; margin: 0 auto; padding: 64px 64px;
    display: grid; grid-template-columns: 220px 1fr; gap: 64px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .case-section { grid-template-columns: 1fr; gap: 24px; padding: 48px 24px; }
  }
  .case-section-header { padding-top: 12px; position: sticky; top: 84px; align-self: start; }
  .case-section-num { color: var(--ink-2); margin-bottom: 12px; }
  .case-section-title {
    font-size: 32px; font-weight: 500; letter-spacing: -0.018em; line-height: 1.08;
    margin: 0; max-width: 220px;
  }
  @media (max-width: 900px) {
    .case-section-header { position: static; }
    .case-section-title { font-size: 28px; max-width: none; }
  }
  .case-section-body { max-width: 640px; }
  .case-p { font-size: 18px; line-height: 1.65; color: var(--ink); margin: 0 0 22px 0; max-width: 640px; }
  .case-p-lede { font-size: 24px; line-height: 1.35; color: var(--ink); letter-spacing: -0.005em; margin-bottom: 32px; }

  /* ---------- stat row ---------- */
  .case-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
    margin: 28px 0 12px 0; padding-top: 20px; border-top: 1px solid var(--rule);
  }
  .case-stat-num {
    font-size: 56px; font-weight: 500; letter-spacing: -0.025em; line-height: 1;
    color: var(--blue); font-variant-numeric: tabular-nums;
  }
  .case-stat-label { margin-top: 10px; color: var(--ink-3); }
  @media (max-width: 720px) { .case-stat-num { font-size: 40px; } }

  /* ---------- pull quote ---------- */
  .case-quote {
    margin: 48px 0; padding: 0; max-width: 720px;
  }
  .case-quote-rule { width: 48px; height: 2px; background: var(--blue); margin-bottom: 24px; }
  .case-quote-text {
    font-size: 34px; font-weight: 500; letter-spacing: -0.018em; line-height: 1.18;
    margin: 0 0 16px 0; color: var(--ink); text-wrap: balance;
  }
  .case-quote-attribution {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3);
  }
  @media (max-width: 720px) { .case-quote-text { font-size: 26px; } }

  /* ---------- block figures (placeholder "images") ---------- */
  .case-figure { margin: 36px 0; padding: 0; }
  .case-figure-block { width: 100%; position: relative; }
  .case-figure-blue   { background: var(--blue); }
  .case-figure-yellow { background: var(--yellow); }
  .case-figure-ink    { background: var(--ink); }
  .case-figure-sky    { background: var(--sky); }
  .case-figure-paper { position: absolute; top: 32px; left: 32px; width: 120px; height: 120px; background: var(--paper); }
  .case-figure-inset { position: absolute; }
  .case-figure-inset-yellow { background: var(--yellow); right: 32px; bottom: 32px; width: 160px; height: 160px; }
  .case-figure-inset-ink    { background: var(--ink); right: 40px; bottom: 40px; width: 140px; height: 140px; }
  .case-figure-inset-sky    { background: var(--sky); left: 50%; top: 50%; transform: translate(-50%, -50%); width: 32%; aspect-ratio: 1 / 1; }
  .case-figure-label {
    position: absolute; bottom: 18px; left: 22px;
    color: rgba(241,236,224,0.7);
  }
  .case-figure-yellow .case-figure-label { color: rgba(17,19,24,0.55); }
  .case-figure-caption {
    margin-top: 14px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em;
  }
  .case-figure-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 36px 0; }
  @media (max-width: 720px) { .case-figure-row { grid-template-columns: 1fr; } }

  /* ---------- full-bleed long-form helper: break out of section grid ---------- */
  .full-bleed {
    grid-column: 1 / -1;
    margin-left: -64px; margin-right: -64px;
    /* span back to viewport edges */
    width: calc(100% + 128px);
    max-width: none;
  }
  @media (max-width: 900px) {
    .full-bleed { margin-left: -24px; margin-right: -24px; width: calc(100% + 48px); }
  }

  /* ---------- next case ---------- */
  .case-next {
    display: block; text-decoration: none; margin-top: 96px;
    transition: background var(--dur-base) var(--ease-std);
  }
  .case-next-yellow { background: var(--yellow); color: var(--ink); }
  .case-next-blue   { background: var(--blue);   color: var(--paper); }
  .case-next-ink    { background: var(--ink);    color: var(--paper); }
  .case-next-inner {
    max-width: 1280px; margin: 0 auto; padding: 80px 64px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 32px;
  }
  .case-next-label { opacity: 0.7; margin-bottom: 16px; }
  .case-next-title {
    font-size: 72px; font-weight: 500; letter-spacing: -0.025em; line-height: 1;
    margin: 0 0 12px 0; max-width: 700px;
  }
  .case-next-meta { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em; opacity: 0.7; }
  .case-next-right { display: flex; align-items: center; gap: 14px; padding-bottom: 4px; }
  .case-next-num { opacity: 0.7; }
  .case-next-arrow {
    width: 48px; height: 48px;
    transition: transform var(--dur-base) var(--ease-std);
  }
  .case-next:hover .case-next-arrow { transform: translate(8px, -8px); }
  @media (max-width: 720px) {
    .case-next-inner { padding: 56px 24px; }
    .case-next-title { font-size: 40px; }
    .case-next-arrow { width: 32px; height: 32px; }
  }

  /* ---------- footer ---------- */
  .site-footer {
    background: var(--ink); color: var(--paper);
    padding: 48px 64px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  @media (max-width: 720px) { .site-footer { padding: 32px 24px; } }
  .footer-mark { font-family: var(--font-sans); font-weight: 500; font-size: 18px; letter-spacing: -0.015em; }
  .footer-meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: rgba(241,236,224,0.65); }
  .site-footer .brand-dot { color: var(--yellow); }
  .site-footer .dot-sep { color: rgba(241,236,224,0.4); }

  /* ---------- motion ---------- */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="CaseHero.jsx"></script>
  <script type="text/babel" src="MetaBlock.jsx"></script>
  <script type="text/babel" src="LongFormSection.jsx"></script>
  <script type="text/babel" src="PullQuote.jsx"></script>
  <script type="text/babel" src="BlockFigure.jsx"></script>
  <script type="text/babel" src="NextCase.jsx"></script>

  <script type="text/babel">
    function TopBar() {
      return (
        <nav className="site-nav">
          <a className="brand" href="../resume/index.html">gabo<span className="brand-dot">.</span></a>
          <a className="back-link" href="../resume/index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" width="14" height="14">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to work
          </a>
        </nav>
      );
    }

    function SiteFooter() {
      return (
        <footer className="site-footer">
          <div className="footer-mark">gabo<span className="brand-dot">.</span></div>
          <div className="footer-meta">
            <span>Designed and built by Gabo</span>
            <span className="dot-sep">·</span>
            <span>Last updated May 2026</span>
            <span className="dot-sep">·</span>
            <span>© 2026</span>
          </div>
        </footer>
      );
    }

    function App() {
      return (
        <div data-screen-label="Case Study">
          <TopBar />
          <CaseHero
            num="01"
            tone="blue"
            client="Mercado Pago"
            year="2024 — 2025"
            role="Product lead · design + scrum"
            title="Rebuilding onboarding for a payments app."
          />

          <MetaBlock rows={[
            { label: 'Role',     value: 'Product lead' },
            { label: 'Team',     value: '4 designers · 1 researcher · 8 eng' },
            { label: 'Duration', value: '6 months' },
            { label: 'Outcome',  value: '+18% activation' },
          ]} />

          <LongFormSection num="01" label="Context" title="A leaky funnel.">
            <P lede>
              Half of the people who downloaded our app never finished setup. Of the half that did, only 40% made it
              to their first payment. The pre-existing onboarding had been stitched together by four teams over three
              years. Nobody owned the whole thing.
            </P>
            <P>
              I was brought in to lead a small squad — four designers, one researcher, eight engineers — and given six
              months to find out what was wrong and fix as much of it as we could.
            </P>
            <StatRow stats={[
              { num: '−42%',   label: 'Drop-off · KYC step' },
              { num: '4',      label: 'Teams involved' },
              { num: '17 yrs', label: 'Combined design debt' },
            ]} />
          </LongFormSection>

          <LongFormSection num="02" label="Research" title="What we found.">
            <P>
              Over three weeks we ran 18 moderated sessions and shadowed support agents for two days. The honest
              answer was boring: people weren't confused, they were just bored. The flow asked for things in the wrong
              order, repeated questions, and made small mistakes feel terminal.
            </P>
            <PullQuote attribution="Participant, Mexico City, age 34">
              I'd already given them my ID. Why are they asking again? I just closed it.
            </PullQuote>
            <P>
              We grouped the findings into three failure modes — repetition, unclear stakes, and irreversibility — and
              picked one to fix first. Repetition.
            </P>

            <BlockFigure
              tone="blue"
              height={420}
              layout="paper-offset"
              label="Fig. 01 — funnel before / after"
              caption="The pre-redesign funnel, with the KYC step as the largest drop-off."
            />
          </LongFormSection>

          <LongFormSection num="03" label="Design" title="One step at a time.">
            <P>
              We rebuilt the flow around a single rule: never ask for something the user has already given us. That
              sounds obvious. It was not how the system worked. Getting there meant reorganising how identity data was
              stored, which meant a back-end refactor, which meant negotiating with two other teams.
            </P>
            <P>
              The new flow has six steps instead of eleven. Each step is recoverable — you can leave and come back
              without losing anything. The KYC step now shows what we already have on file and asks only for the
              missing pieces.
            </P>

            <FigureRow
              left={<BlockFigure tone="yellow" height={300} layout="inset-ink" label="Step 03" />}
              right={<BlockFigure tone="ink" height={300} layout="inset-sky" label="Step 04" />}
            />
            <P>
              The hardest part wasn't the design. It was holding the line on scope while half a dozen stakeholders
              tried to bolt their pet feature onto the new flow. We shipped the smallest thing that could prove the
              hypothesis.
            </P>
          </LongFormSection>

          <LongFormSection num="04" label="Outcome" title="Numbers and what they hide.">
            <P lede>
              Activation went from 41% to 59% over two release cycles. Support tickets about onboarding fell 28%. The
              average time to first payment dropped from 11 minutes to 4.
            </P>
            <StatRow stats={[
              { num: '+18%', label: 'Activation' },
              { num: '−28%', label: 'Support tickets' },
              { num: '7 min', label: 'Time-to-payment saved' },
            ]} />
            <P>
              What the numbers hide: we shipped two regressions, both my fault. The KYC step still over-collects on
              one specific path, and the resume-flow has an edge case where state is lost if you switch SIMs. Both
              are in the queue for the next cycle.
            </P>
            <PullQuote attribution="Internal review, December 2024">
              The new flow is the first piece of the app I'd hand to my mother without warning her first.
            </PullQuote>
          </LongFormSection>

          <LongFormSection num="05" label="Reflection" title="What I'd do differently.">
            <P>
              I would have done the research in two weeks, not three. We knew the answer by the end of week one and
              spent two more confirming it. I'd also have negotiated for one fewer stakeholder review — they didn't
              improve the design, they just slowed it down.
            </P>
            <P>
              The thing I'd keep: pairing a designer with each engineer for the first two weeks of build. It cost us a
              little speed up front and saved us two months of rework later.
            </P>
          </LongFormSection>

          <NextCase
            num="02"
            tone="yellow"
            title="Designing a component library across nine teams."
            meta="2023 · Kavak · Design system v2"
          />
          <SiteFooter />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
