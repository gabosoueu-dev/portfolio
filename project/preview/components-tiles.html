<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Case study tile (block hover)</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 36px; min-height: 280px; box-sizing: border-box; display: flex; gap: 28px; align-items: stretch; }
  .tile { position: relative; width: 220px; height: 220px; flex: none; cursor: pointer; }
  .shadow { position: absolute; inset: 0; background: var(--ink); }
  .block { position: absolute; inset: 0; padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; transition: transform 220ms cubic-bezier(0.2,0.8,0.2,1); }
  .tile:hover .block { transform: translate(8px, 8px); }
  .b1 { background: var(--blue); color: var(--paper); }
  .b2 { background: var(--yellow); color: var(--ink); }
  .b3 { background: var(--ink); color: var(--paper); }
  .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .title { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.05; }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; opacity: 0.8; margin-top: 6px; }
</style>
</head>
<body>
  <div class="tile">
    <div class="shadow"></div>
    <div class="block b1">
      <div class="label">01 / Case</div>
      <div><div class="title">Onboarding rebuild</div><div class="meta">+18% activation · 2024</div></div>
    </div>
  </div>
  <div class="tile">
    <div class="shadow"></div>
    <div class="block b2">
      <div class="label">02 / Case</div>
      <div><div class="title">Design system v2</div><div class="meta">9 teams · 2023</div></div>
    </div>
  </div>
  <div class="tile">
    <div class="shadow"></div>
    <div class="block b3">
      <div class="label">03 / Case</div>
      <div><div class="title">Scrum from scratch</div><div class="meta">12 ppl · 2022</div></div>
    </div>
  </div>
</body>
</html>
