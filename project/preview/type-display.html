<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Display specimen</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 36px 40px; min-height: 280px; box-sizing: border-box; display: flex; align-items: center; }
  .specimen { display: flex; align-items: baseline; gap: 8px; }
  .glyph { font-size: 200px; font-weight: 500; letter-spacing: -0.06em; line-height: 0.85; color: var(--ink); }
  .dot { color: var(--blue); font-size: 200px; line-height: 0.85; }
  .side { margin-left: auto; max-width: 220px; }
  .side .label { display: block; margin-bottom: 12px; }
  .side h4 { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.05; margin: 0 0 10px 0; }
  .side p { font-size: 13px; color: var(--ink-3); margin: 0; line-height: 1.5; }
</style>
</head>
<body>
  <div class="specimen">
    <span class="glyph">Gg</span>
    <span class="dot">.</span>
  </div>
  <div class="side">
    <span class="label">Display · Geist 500</span>
    <h4>Hi, I'm Gabo.</h4>
    <p>Type leads. Sentence case, tight tracking, single weight. The full stop in blue is the only flourish.</p>
  </div>
</body>
</html>
