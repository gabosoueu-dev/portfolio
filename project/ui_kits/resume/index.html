<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gabo — CV</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  /* =========================================================
     Resume / CV — page styles
     ========================================================= */

  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); }
  * { box-sizing: border-box; }

  .page { padding: 0; }
  .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 64px; }
  @media (max-width: 720px) { .container { padding: 0 24px; } }

  /* ---------- mono helper ---------- */
  .mono-label {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-2);
  }
  .dot-sep { color: var(--ink-3); margin: 0 8px; }

  /* ---------- nav ---------- */
  .site-nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 64px;
    background: rgba(241, 236, 224, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .brand {
    font-family: var(--font-sans); font-weight: 500; font-size: 20px;
    letter-spacing: -0.015em; color: var(--ink); text-decoration: none;
  }
  .brand-dot { color: var(--blue); }
  .nav-links { display: flex; gap: 28px; }
  .nav-link {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); text-decoration: none;
    transition: color var(--dur-fast) var(--ease-std);
  }
  .nav-link.is-active { color: var(--ink); }
  .nav-link:hover { color: var(--blue); }
  .nav-cta {
    display: inline-flex; align-items: center;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink); border: 1px solid var(--ink); padding: 9px 16px;
    border-radius: 999px; text-decoration: none;
    transition: background var(--dur-fast) var(--ease-std), color var(--dur-fast) var(--ease-std);
  }
  .nav-cta:hover { background: var(--ink); color: var(--paper); }
  @media (max-width: 720px) { .site-nav { padding: 16px 24px; } .nav-links { display: none; } }

  /* ---------- intro ---------- */
  .intro { padding: 96px 64px 128px 64px; max-width: 1280px; margin: 0 auto; }
  .intro-grid {
    display: grid;
    grid-template-columns: 180px 1fr 280px;
    gap: 48px;
    align-items: start;
  }
  .intro-label { padding-top: 14px; }
  .intro-rule { width: 36px; height: 1px; background: var(--ink); margin-top: 16px; }
  .intro-title {
    font-size: 112px; font-weight: 500; letter-spacing: -0.035em; line-height: 0.98;
    margin: 0; text-wrap: balance;
  }
  .intro-dot { color: var(--blue); }
  .intro-lede {
    font-size: 22px; line-height: 1.3; color: var(--ink); margin: 32px 0 16px 0;
    max-width: 560px; letter-spacing: -0.005em;
  }
  .intro-meta {
    font-family: var(--font-mono); font-size: 13px; color: var(--ink-3);
    margin: 0 0 36px 0;
  }
  .intro-cta { display: flex; gap: 10px; flex-wrap: wrap; }
  .intro-block {
    width: 100%; height: 280px; background: var(--blue);
    position: relative; align-self: end;
    animation: fadeUp 0.7s var(--ease-std) both;
  }
  .intro-block-paper {
    position: absolute; top: 20px; left: 20px; width: 60px; height: 60px; background: var(--paper);
  }
  @media (max-width: 900px) {
    .intro { padding: 56px 24px 80px 24px; }
    .intro-grid { grid-template-columns: 1fr; gap: 24px; }
    .intro-title { font-size: 64px; }
    .intro-block { height: 200px; }
  }

  /* ---------- section header pattern ---------- */
  section { padding: 96px 64px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 720px) { section { padding: 64px 24px; } }
  .section-header {
    display: grid; grid-template-columns: 180px 1fr; gap: 48px;
    padding-top: 24px; border-top: 1px solid var(--ink);
    margin-bottom: 64px;
  }
  .section-num {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-2); padding-top: 6px;
  }
  .section-title {
    font-size: 48px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.02;
    margin: 0; max-width: 640px;
  }
  @media (max-width: 720px) {
    .section-header { grid-template-columns: 1fr; gap: 12px; }
    .section-title { font-size: 36px; }
  }

  /* ---------- experience ---------- */
  .exp-list { display: flex; flex-direction: column; }
  .exp-item {
    display: grid; grid-template-columns: 180px 1fr 280px; gap: 48px;
    padding: 32px 0; border-top: 1px solid var(--rule);
  }
  .exp-item:first-child { border-top: 0; }
  .exp-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; padding-top: 8px; }
  .exp-years { color: var(--ink-2); }
  .exp-role { font-size: 26px; font-weight: 500; letter-spacing: -0.012em; line-height: 1.1; margin: 0 0 6px 0; }
  .exp-company { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 14px; }
  .exp-body { font-size: 16px; line-height: 1.55; color: var(--ink-2); margin: 0 0 14px 0; max-width: 560px; }
  .exp-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  @media (max-width: 900px) {
    .exp-item { grid-template-columns: 1fr; gap: 8px; padding: 28px 0; }
  }

  /* ---------- selected work tiles ---------- */
  .work-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
  }
  @media (max-width: 1000px) { .work-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px)  { .work-grid { grid-template-columns: 1fr; } }
  .work-tile {
    position: relative; aspect-ratio: 1 / 1; cursor: pointer; text-decoration: none;
    display: block;
  }
  .work-tile-shadow {
    position: absolute; inset: 0; background: var(--ink);
  }
  .work-tile-block {
    position: absolute; inset: 0; padding: 22px 24px;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: transform 220ms var(--ease-std);
  }
  .work-tile:hover .work-tile-block { transform: translate(8px, 8px); }
  .work-tile-blue   { background: var(--blue);   color: var(--paper); }
  .work-tile-yellow { background: var(--yellow); color: var(--ink); }
  .work-tile-ink    { background: var(--ink);    color: var(--paper); }
  .work-tile-sky    { background: var(--sky);    color: var(--ink); }
  .work-tile-num { opacity: 0.85; }
  .work-tile-yellow .work-tile-num, .work-tile-sky .work-tile-num { color: var(--ink-2); }
  .work-tile-title { font-size: 22px; font-weight: 500; letter-spacing: -0.012em; line-height: 1.1; }
  .work-tile-meta {
    margin-top: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em;
    opacity: 0.8;
  }

  /* ---------- skills ---------- */
  .skills-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px;
  }
  @media (max-width: 720px) { .skills-grid { grid-template-columns: 1fr; gap: 24px; } }
  .skills-group { border-top: 1px solid var(--rule); padding-top: 18px; }
  .skills-group-title {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 14px;
  }
  .skills-tags { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ---------- contact (full-bleed blue) ---------- */
  .contact {
    margin: 96px 0 0 0; padding: 0; max-width: none; width: 100%;
    background: var(--blue); color: var(--paper);
  }
  .contact-inner { max-width: 1280px; margin: 0 auto; padding: 96px 64px; }
  @media (max-width: 720px) { .contact-inner { padding: 64px 24px; } }
  .contact-label { color: rgba(241,236,224,0.7); margin-bottom: 24px; }
  .contact-title {
    font-size: 128px; font-weight: 500; letter-spacing: -0.035em; line-height: 0.98;
    margin: 0 0 64px 0; color: var(--paper);
  }
  .contact-dot { color: var(--yellow); }
  @media (max-width: 720px) { .contact-title { font-size: 64px; margin-bottom: 40px; } }
  .contact-grid {
    display: grid; grid-template-columns: 1.4fr 1.4fr 1fr; gap: 48px;
    padding-top: 32px; border-top: 1px solid rgba(241,236,224,0.25);
  }
  @media (max-width: 720px) { .contact-grid { grid-template-columns: 1fr; gap: 28px; } }
  .contact-sub { color: rgba(241,236,224,0.65); margin-bottom: 10px; }
  .contact-link {
    display: inline-flex; flex-direction: column; align-items: flex-start;
    background: transparent; border: 0; padding: 0;
    color: var(--paper); font-family: var(--font-sans); font-size: 22px; font-weight: 500;
    letter-spacing: -0.012em; text-decoration: underline; text-decoration-color: rgba(241,236,224,0.3);
    text-underline-offset: 6px; cursor: pointer;
    transition: text-decoration-color var(--dur-fast) var(--ease-std), color var(--dur-fast) var(--ease-std);
  }
  .contact-link:hover { color: var(--yellow); text-decoration-color: var(--yellow); }
  .contact-copy {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(241,236,224,0.55); margin-top: 6px; text-decoration: none;
  }
  .contact-stack { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .contact-stack .contact-link { font-size: 18px; }
  .contact-static { font-size: 22px; font-weight: 500; letter-spacing: -0.012em; }
  .contact-static-dim { font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: rgba(241,236,224,0.6); margin-top: 6px; letter-spacing: 0.04em; }

  /* ---------- footer ---------- */
  .site-footer {
    background: var(--ink); color: var(--paper);
    padding: 48px 64px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  @media (max-width: 720px) { .site-footer { padding: 32px 24px; } }
  .footer-mark { font-family: var(--font-sans); font-weight: 500; font-size: 18px; letter-spacing: -0.015em; }
  .footer-meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: rgba(241,236,224,0.65); }
  .site-footer .brand-dot { color: var(--yellow); }
  .site-footer .dot-sep { color: rgba(241,236,224,0.4); }

  /* ---------- subtle fade-up on enter ---------- */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .intro-title, .intro-lede, .intro-meta, .intro-cta { animation: fadeUp 0.6s var(--ease-std) both; }
  .intro-lede { animation-delay: 0.08s; }
  .intro-meta { animation-delay: 0.14s; }
  .intro-cta  { animation-delay: 0.2s; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned per design-system guidance) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Intro.jsx"></script>
  <script type="text/babel" src="ExperienceItem.jsx"></script>
  <script type="text/babel" src="SelectedWork.jsx"></script>
  <script type="text/babel" src="Skills.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <div className="page" data-screen-label="Resume / CV">
          <Header active="cv" />
          <Intro />
          <ExperienceList />
          <SelectedWork />
          <Skills />
          <Contact />
          <Footer />
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
