<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Section header pattern</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 32px 40px; min-height: 260px; box-sizing: border-box; }
  .header { display: grid; grid-template-columns: 180px 1fr; gap: 32px; align-items: baseline; padding-top: 16px; border-top: 1px solid var(--ink); }
  .left { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); padding-top: 6px; }
  .title { font-size: 44px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.02; margin: 0 0 14px 0; max-width: 560px; }
  .sub { font-size: 16px; color: var(--ink-2); margin: 0; max-width: 520px; line-height: 1.5; }
  .meta { margin-top: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; color: var(--ink-3); }
</style>
</head>
<body>
  <div class="header">
    <div class="left">02 / Experience</div>
    <div>
      <h2 class="title">Six years of zero‑to‑one product work.</h2>
      <p class="sub">Mostly fintech and B2B SaaS. I lead the design, run the scrum, and ship the thing.</p>
      <div class="meta">2019 — present</div>
    </div>
  </div>
</body>
</html>
