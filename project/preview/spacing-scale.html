<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 36px; min-height: 320px; box-sizing: border-box; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 6px 0; vertical-align: middle; }
  .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); width: 80px; }
  .px { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); width: 60px; }
  .bar { background: var(--ink); height: 10px; }
</style>
</head>
<body>
  <table>
    <tr><td class="name">s-1</td><td class="px">4</td><td><div class="bar" style="width:4px"></div></td></tr>
    <tr><td class="name">s-2</td><td class="px">8</td><td><div class="bar" style="width:8px"></div></td></tr>
    <tr><td class="name">s-3</td><td class="px">12</td><td><div class="bar" style="width:12px"></div></td></tr>
    <tr><td class="name">s-4</td><td class="px">16</td><td><div class="bar" style="width:16px"></div></td></tr>
    <tr><td class="name">s-6</td><td class="px">24</td><td><div class="bar" style="width:24px"></div></td></tr>
    <tr><td class="name">s-8</td><td class="px">32</td><td><div class="bar" style="width:32px"></div></td></tr>
    <tr><td class="name">s-12</td><td class="px">48</td><td><div class="bar" style="width:48px"></div></td></tr>
    <tr><td class="name">s-16</td><td class="px">64</td><td><div class="bar" style="width:64px"></div></td></tr>
    <tr><td class="name">s-24</td><td class="px">96</td><td><div class="bar" style="width:96px"></div></td></tr>
    <tr><td class="name">s-32</td><td class="px">128</td><td><div class="bar" style="width:128px"></div></td></tr>
    <tr><td class="name">s-48</td><td class="px">192</td><td><div class="bar" style="width:192px"></div></td></tr>
    <tr><td class="name">s-64</td><td class="px">256</td><td><div class="bar" style="width:256px"></div></td></tr>
  </table>
</body>
</html>
