<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Layout grid</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 32px; min-height: 280px; box-sizing: border-box; }
  .frame { position: relative; width: 100%; height: 220px; background: var(--paper-3); border: 1px solid var(--rule); }
  .cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; padding: 10px; }
  .col { background: rgba(43,60,224,0.08); border-left: 1px solid rgba(43,60,224,0.18); }
  .content { position: absolute; left: 11%; top: 24px; right: 11%; }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .title { font-size: 28px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.05; color: var(--ink); margin-top: 6px; max-width: 60%; }
  .block { position: absolute; right: 11%; top: 70px; width: 28%; height: 130px; background: var(--blue); }
  .meta { position: absolute; left: 11%; bottom: 18px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
</style>
</head>
<body>
  <div class="frame">
    <div class="cols">
      <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
      <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
      <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
    </div>
    <div class="content">
      <div class="label">01 / Selected work</div>
      <div class="title">Long type column on the left, a hard block on the right.</div>
    </div>
    <div class="block"></div>
    <div class="meta">12 col · 32 gutter · 11% paper margin</div>
  </div>
</body>
</html>
