<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Tags &amp; chips</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 30px 40px; min-height: 220px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .what { width: 110px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .tag-solid { background: var(--ink); color: var(--paper); border: 0; }
  .tag-blue { background: var(--blue); color: var(--paper); border: 0; }
</style>
</head>
<body>
  <div class="row">
    <span class="what">Outline</span>
    <span class="tag">Product</span>
    <span class="tag">Strategy</span>
    <span class="tag">Research</span>
    <span class="tag">Design Systems</span>
    <span class="tag">Scrum</span>
  </div>
  <div class="row">
    <span class="what">Solid</span>
    <span class="tag tag-solid">Featured</span>
    <span class="tag tag-blue">Current</span>
    <span class="tag tag-solid">2024 — present</span>
  </div>
</body>
</html>
