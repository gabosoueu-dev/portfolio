<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 32px 40px; min-height: 220px; box-sizing: border-box; }
  .head { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 18px; align-items: center; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  svg { width: 22px; height: 22px; color: var(--ink); }
  .n { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; color: var(--ink-3); }
  .note { margin-top: 20px; font-size: 13px; color: var(--ink-2); max-width: 540px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="head">Lucide · 1.5 stroke · currentColor</div>
  <div class="grid">
    <div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg><span class="n">arrow ↗</span></div>
    <div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg><span class="n">arrow ↓</span></div>
    <div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span class="n">menu</span></div>
    <div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6 18 18M6 18 18 6"/></svg><span class="n">close</span></div>
    <div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 7 9 6 9-6"/></svg><span class="n">mail</span></div>
    <div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span class="n">download</span></div>
    <div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg><span class="n">clock</span></div>
  </div>
  <p class="note">No emoji, no unicode glyphs. Icons are decorative — labels always carry meaning. 24px in nav, 18px inline with type.</p>
</body>
</html>
